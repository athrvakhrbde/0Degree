<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Prevent iOS Safari from auto-formatting phone numbers -->
    <meta name="format-detection" content="telephone=no">
    
    <!-- Primary Meta Tags -->
    <title>Careers - 0°</title>
    <meta name="title" content="Careers - 0°">
    <meta name="description" content="Join 0° - careers and opportunities for those navigating alternative paths.">
    <meta name="keywords" content="jobs, careers, opportunities, alternative education, dropout support">
    <meta name="author" content="0°">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://0degree-three.vercel.app/careers">
    <meta property="og:title" content="Careers - 0°">
    <meta property="og:description" content="Join 0° - careers and opportunities for those navigating alternative paths.">
    <meta property="og:image" content="https://0degree-three.vercel.app/favicon.svg">
    <meta property="og:image:width" content="181">
    <meta property="og:image:height" content="184">
    <meta property="og:image:type" content="image/svg+xml">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://0degree-three.vercel.app/careers">
    <meta property="twitter:title" content="Careers - 0°">
    <meta property="twitter:description" content="Join 0° - careers and opportunities for those navigating alternative paths.">
    <meta property="twitter:image" content="https://0degree-three.vercel.app/favicon.svg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#262626">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- Preload critical assets -->
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="0degree-logo.svg" as="image">
    
    <!-- Font Loading with display=swap for performance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css" media="all">
    <style>
        .careers-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 clamp(20px, 2vw, 40px);
        }
        
        .careers-header {
            margin-bottom: 64px;
        }
        
        .careers-title {
            font-size: clamp(32px, 3.5vw, 48px);
            font-weight: 500;
            color: var(--text-black);
            margin: 0 0 16px 0;
            letter-spacing: -1.5px;
            line-height: 1.2;
        }
        
        .careers-subtitle {
            font-size: clamp(16px, 1.4vw, 18px);
            color: var(--text-gray);
            margin: 0;
            line-height: 1.6;
        }
        
        .job-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .job-item {
            padding: 40px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: opacity 0.2s ease;
        }
        
        .job-item:last-child {
            border-bottom: none;
        }
        
        .job-item:hover {
            opacity: 0.85;
        }
        
        .job-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 12px;
        }
        
        .job-title {
            font-size: clamp(20px, 2vw, 24px);
            font-weight: 500;
            color: var(--text-black);
            margin: 0;
            line-height: 1.3;
            letter-spacing: -0.5px;
            flex: 1;
        }
        
        .job-link {
            color: #00ffce;
            text-decoration: none;
            font-size: clamp(14px, 1.2vw, 16px);
            font-weight: 400;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            flex-shrink: 0;
        }
        
        .job-link:hover {
            opacity: 0.7;
        }
        
        .job-meta {
            font-size: clamp(14px, 1.2vw, 15px);
            color: var(--text-gray);
            margin-bottom: 16px;
            font-weight: 400;
        }
        
        .job-description {
            font-size: clamp(15px, 1.3vw, 16px);
            color: var(--text-gray);
            line-height: 1.7;
            margin: 0;
            max-width: 100%;
        }
        
        .jobs-empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-gray);
            font-size: clamp(16px, 1.4vw, 18px);
        }
        
        @media screen and (max-width: 768px) {
            .careers-header {
                margin-bottom: 48px;
            }
            
            .job-item {
                padding: 32px 0;
            }
            
            .job-header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .job-link {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">
                    <img src="0degree-logo.svg" alt="0Degree Logo" class="logo-img" loading="eager" width="32" height="32">
                </a>
            </div>
            <div class="nav-right">
                <a href="/join" class="nav-link">Join</a>
                <!-- <a href="/why" class="nav-link">Why</a> -->
                <a href="/thesis" class="nav-link">Thesis</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero thesis-hero" aria-label="Careers section">
            <div class="container">
                <div class="hero-content">
                    <div class="hero-left">
                        <div class="careers-container">
                            <div class="careers-header">
                                <h1 class="careers-title">Careers</h1>
                                <p class="careers-subtitle">Join us in building infrastructure for responsible first steps.</p>
                            </div>
                            
                            <ul class="job-list" id="jobList">
                                <!-- Jobs will be loaded here -->
                            </ul>
                            <div class="jobs-empty" id="jobsEmpty" style="display: none;">
                                No open positions at the moment. Check back soon.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js" defer></script>
    <script>
        // Job listings data - you can replace this with an API call or external data source
        const jobs = [
            {
                title: "Product Designer",
                description: "We're looking for a product designer to help shape the future of alternative education. You'll work on designing experiences that support people navigating uncertainty and building new paths.",
                location: "Remote",
                type: "Full-time",
                link: "#"
            },
            {
                title: "Full Stack Engineer",
                description: "Join our engineering team to build tools and platforms that help people find structure and opportunity. Experience with modern web technologies preferred.",
                location: "Remote",
                type: "Full-time",
                link: "#"
            },
            {
                title: "Community Manager",
                description: "Help build and nurture our community of people exploring alternative paths. You'll facilitate connections, organize events, and support members in their journey.",
                location: "Remote / Hybrid",
                type: "Part-time",
                link: "#"
            },
            {
                title: "Content Writer",
                description: "Create content that resonates with people navigating uncertainty. Write articles, guides, and resources that provide clarity and support.",
                location: "Remote",
                type: "Contract",
                link: "#"
            },
            {
                title: "Operations Lead",
                description: "Help us scale our operations and build systems that support our mission. You'll work on everything from process improvement to strategic planning.",
                location: "Remote",
                type: "Full-time",
                link: "#"
            }
        ];

        function renderJobs() {
            const jobList = document.getElementById('jobList');
            const jobsEmpty = document.getElementById('jobsEmpty');
            
            if (jobs.length === 0) {
                jobList.style.display = 'none';
                jobsEmpty.style.display = 'block';
                return;
            }
            
            jobsEmpty.style.display = 'none';
            jobList.innerHTML = jobs.map(job => `
                <li class="job-item">
                    <div class="job-header-row">
                        <h2 class="job-title">${job.title}</h2>
                        ${job.link ? `<a href="${job.link}" class="job-link" target="_blank" rel="noopener noreferrer">Apply →</a>` : ''}
                    </div>
                    <div class="job-meta">
                        ${job.location && job.type ? `${job.location} · ${job.type}` : ''}
                        ${job.location && !job.type ? job.location : ''}
                        ${!job.location && job.type ? job.type : ''}
                    </div>
                    ${job.description ? `<p class="job-description">${job.description}</p>` : ''}
                </li>
            `).join('');
        }

        // Render jobs on page load
        document.addEventListener('DOMContentLoaded', renderJobs);
    </script>
</body>
</html>
