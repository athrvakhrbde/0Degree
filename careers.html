<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Prevent iOS Safari from auto-formatting phone numbers -->
    <meta name="format-detection" content="telephone=no">
    
    <!-- Primary Meta Tags -->
    <title>Careers - 0°</title>
    <meta name="title" content="Careers - 0°">
    <meta name="description" content="Join 0° - careers and opportunities for those navigating alternative paths.">
    <meta name="keywords" content="jobs, careers, opportunities, alternative education, dropout support">
    <meta name="author" content="0°">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://0degree-three.vercel.app/careers">
    <meta property="og:title" content="Careers - 0°">
    <meta property="og:description" content="Join 0° - careers and opportunities for those navigating alternative paths.">
    <meta property="og:image" content="https://0degree-three.vercel.app/favicon.svg">
    <meta property="og:image:width" content="181">
    <meta property="og:image:height" content="184">
    <meta property="og:image:type" content="image/svg+xml">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://0degree-three.vercel.app/careers">
    <meta property="twitter:title" content="Careers - 0°">
    <meta property="twitter:description" content="Join 0° - careers and opportunities for those navigating alternative paths.">
    <meta property="twitter:image" content="https://0degree-three.vercel.app/favicon.svg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#262626">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- Preload critical assets -->
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="0degree-logo.svg" as="image">
    
    <!-- Font Loading with display=swap for performance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css" media="all">
    <style>
        .careers-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 clamp(24px, 3vw, 48px);
            width: 100%;
        }
        
        .thesis-hero .hero-content {
            justify-content: center !important;
        }
        
        .thesis-hero .hero-left {
            max-width: 100% !important;
            display: flex !important;
            justify-content: center !important;
        }
        
        .careers-header {
            margin-bottom: 56px;
            padding-top: 24px;
        }
        
        .careers-title {
            font-size: clamp(36px, 4vw, 56px);
            font-weight: 500;
            color: var(--text-black);
            margin: 0 0 12px 0;
            letter-spacing: -2px;
            line-height: 1.1;
        }
        
        .careers-subtitle {
            font-size: clamp(16px, 1.5vw, 18px);
            color: var(--text-gray);
            margin: 0;
            line-height: 1.6;
            font-weight: 400;
        }
        
        .filters-container {
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .filters-title {
            font-size: clamp(14px, 1.2vw, 15px);
            font-weight: 500;
            color: var(--text-black);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0;
        }
        
        .jobs-count {
            font-size: clamp(14px, 1.2vw, 15px);
            color: var(--text-gray);
            font-weight: 400;
        }
        
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .filter-label {
            font-size: clamp(13px, 1.1vw, 14px);
            color: var(--text-gray);
            font-weight: 400;
            margin-right: 4px;
        }
        
        .filter-button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-gray);
            padding: 10px 18px;
            font-size: clamp(13px, 1.1vw, 14px);
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
            font-family: inherit;
            white-space: nowrap;
        }
        
        .filter-button:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text-black);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .filter-button.active {
            border-color: #00ffce;
            color: #00ffce;
            background: rgba(0, 255, 206, 0.08);
        }
        
        .filter-button.all {
            border-color: transparent;
            padding: 10px 12px;
        }
        
        .filter-button.all.active {
            border-color: #00ffce;
            color: #00ffce;
            background: rgba(0, 255, 206, 0.08);
        }
        
        .job-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .job-item {
            padding: 40px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .job-item:last-child {
            border-bottom: none;
        }
        
        .job-item:hover {
            opacity: 0.9;
            padding-left: 4px;
        }
        
        .job-company {
            font-size: clamp(14px, 1.2vw, 15px);
            font-weight: 500;
            color: #00ffce;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .job-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 32px;
            margin-bottom: 12px;
        }
        
        .job-title-wrapper {
            flex: 1;
        }
        
        .job-title {
            font-size: clamp(22px, 2.2vw, 28px);
            font-weight: 500;
            color: var(--text-black);
            margin: 0;
            line-height: 1.3;
            letter-spacing: -0.8px;
        }
        
        .job-link {
            color: #00ffce;
            text-decoration: none;
            font-size: clamp(14px, 1.2vw, 15px);
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .job-link:hover {
            opacity: 0.8;
            gap: 8px;
        }
        
        .job-link::after {
            content: "→";
            transition: transform 0.2s ease;
        }
        
        .job-link:hover::after {
            transform: translateX(4px);
        }
        
        .job-meta {
            font-size: clamp(14px, 1.2vw, 15px);
            color: var(--text-gray);
            margin-bottom: 16px;
            font-weight: 400;
            line-height: 1.5;
        }
        
        .job-description {
            font-size: clamp(15px, 1.3vw, 16px);
            color: var(--text-gray);
            line-height: 1.75;
            margin: 0;
            max-width: 100%;
            font-weight: 400;
        }
        
        .jobs-empty {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-gray);
            font-size: clamp(16px, 1.4vw, 18px);
        }
        
        .jobs-empty-title {
            font-size: clamp(20px, 2vw, 24px);
            color: var(--text-black);
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        @media screen and (max-width: 768px) {
            .careers-header {
                margin-bottom: 40px;
                padding-top: 16px;
            }
            
            .filters-container {
                margin-bottom: 32px;
                padding-bottom: 24px;
            }
            
            .filters-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 20px;
            }
            
            .filters-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .filter-group {
                width: 100%;
                flex-wrap: wrap;
            }
            
            .job-item {
                padding: 32px 0;
            }
            
            .job-item:hover {
                padding-left: 0;
            }
            
            .job-header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .job-link {
                align-self: flex-start;
            }
        }
        
        @media screen and (max-width: 480px) {
            .careers-container {
                padding: 0 20px;
            }
            
            .job-item {
                padding: 28px 0;
            }
        }
    </style>
</head>
<body>
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">
                    <img src="0degree-logo.svg" alt="0Degree Logo" class="logo-img" loading="eager" width="32" height="32">
                </a>
            </div>
            <div class="nav-right">
                <a href="/join" class="nav-link">Join</a>
                <!-- <a href="/why" class="nav-link">Why</a> -->
                <a href="/thesis" class="nav-link">Thesis</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="hero thesis-hero" aria-label="Careers section">
            <div class="container">
                <div class="hero-content">
                    <div class="hero-left">
                        <div class="careers-container">
                            <div class="careers-header">
                                <h1 class="careers-title">Careers</h1>
                                <p class="careers-subtitle">Join us in building infrastructure for responsible first steps.</p>
                            </div>
                            
                            <div class="filters-container">
                                <div class="filters-header">
                                    <h2 class="filters-title">Filter Positions</h2>
                                    <span class="jobs-count" id="jobsCount"></span>
                                </div>
                                <div class="filters-row">
                                    <div class="filter-group">
                                        <span class="filter-label">Type</span>
                                        <button class="filter-button all active" data-filter="type" data-value="all">All</button>
                                        <button class="filter-button" data-filter="type" data-value="Full-time">Full-time</button>
                                        <button class="filter-button" data-filter="type" data-value="Part-time">Part-time</button>
                                        <button class="filter-button" data-filter="type" data-value="Contract">Contract</button>
                                    </div>
                                    <div class="filter-group">
                                        <span class="filter-label">Location</span>
                                        <button class="filter-button all active" data-filter="location" data-value="all">All</button>
                                        <button class="filter-button" data-filter="location" data-value="Remote">Remote</button>
                                        <button class="filter-button" data-filter="location" data-value="Hybrid">Hybrid</button>
                                    </div>
                                </div>
                            </div>
                            
                            <ul class="job-list" id="jobList">
                                <!-- Jobs will be loaded here -->
                            </ul>
                            <div class="jobs-empty" id="jobsEmpty" style="display: none;">
                                <div class="jobs-empty-title">No positions found</div>
                                <p>Try adjusting your filters to see more opportunities.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js" defer></script>
    <script>
        // Job listings data
        const allJobs = [
            {
                company: "0Degree",
                title: "Product Designer",
                description: "We're looking for a product designer to help shape the future of alternative education. You'll work on designing experiences that support people navigating uncertainty and building new paths.",
                location: "Remote",
                type: "Full-time",
                link: "#"
            },
            {
                company: "0Degree",
                title: "Full Stack Engineer",
                description: "Join our engineering team to build tools and platforms that help people find structure and opportunity. Experience with modern web technologies preferred.",
                location: "Remote",
                type: "Full-time",
                link: "#"
            },
            {
                company: "0Degree",
                title: "Community Manager",
                description: "Help build and nurture our community of people exploring alternative paths. You'll facilitate connections, organize events, and support members in their journey.",
                location: "Remote / Hybrid",
                type: "Part-time",
                link: "#"
            },
            {
                company: "0Degree",
                title: "Content Writer",
                description: "Create content that resonates with people navigating uncertainty. Write articles, guides, and resources that provide clarity and support.",
                location: "Remote",
                type: "Contract",
                link: "#"
            },
            {
                company: "0Degree",
                title: "Operations Lead",
                description: "Help us scale our operations and build systems that support our mission. You'll work on everything from process improvement to strategic planning.",
                location: "Remote",
                type: "Full-time",
                link: "#"
            }
        ];

        let activeFilters = {
            type: 'all',
            location: 'all'
        };

        function filterJobs() {
            let filteredJobs = allJobs.filter(job => {
                const typeMatch = activeFilters.type === 'all' || job.type === activeFilters.type;
                const locationMatch = activeFilters.location === 'all' || 
                    job.location.includes(activeFilters.location) || 
                    (activeFilters.location === 'Hybrid' && job.location.includes('Hybrid'));
                return typeMatch && locationMatch;
            });

            renderJobs(filteredJobs);
            updateJobsCount(filteredJobs.length);
        }

        function renderJobs(jobs) {
            const jobList = document.getElementById('jobList');
            const jobsEmpty = document.getElementById('jobsEmpty');
            
            if (jobs.length === 0) {
                jobList.style.display = 'none';
                jobsEmpty.style.display = 'block';
                return;
            }
            
            jobsEmpty.style.display = 'none';
            jobList.style.display = 'block';
            jobList.innerHTML = jobs.map(job => `
                <li class="job-item" onclick="${job.link && job.link !== '#' ? `window.open('${job.link}', '_blank')` : ''}">
                    ${job.company ? `<div class="job-company">${job.company}</div>` : ''}
                    <div class="job-header-row">
                        <div class="job-title-wrapper">
                            <h2 class="job-title">${job.title}</h2>
                        </div>
                        ${job.link ? `<a href="${job.link}" class="job-link" onclick="event.stopPropagation()" target="_blank" rel="noopener noreferrer">Apply</a>` : ''}
                    </div>
                    <div class="job-meta">
                        ${job.location && job.type ? `${job.location} · ${job.type}` : ''}
                        ${job.location && !job.type ? job.location : ''}
                        ${!job.location && job.type ? job.type : ''}
                    </div>
                    ${job.description ? `<p class="job-description">${job.description}</p>` : ''}
                </li>
            `).join('');
        }

        function updateJobsCount(count) {
            const jobsCount = document.getElementById('jobsCount');
            jobsCount.textContent = `${count} ${count === 1 ? 'position' : 'positions'}`;
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-button').forEach(button => {
                const filterType = button.getAttribute('data-filter');
                const filterValue = button.getAttribute('data-value');
                
                if (activeFilters[filterType] === filterValue) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        // Initialize filters
        document.addEventListener('DOMContentLoaded', function() {
            renderJobs(allJobs);
            updateJobsCount(allJobs.length);
            
            // Filter button handlers
            document.querySelectorAll('.filter-button').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const filterType = this.getAttribute('data-filter');
                    const filterValue = this.getAttribute('data-value');
                    
                    activeFilters[filterType] = filterValue;
                    updateFilterButtons();
                    filterJobs();
                });
            });
        });
    </script>
</body>
</html>
